<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0e7" />
    <meta
      name="description"
      content="Chez Nours, un duplex cosy à Cauterets. Notre site arrive bientôt."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chez Nours — Cauterets" />
    <meta
      property="og:description"
      content="Un duplex cosy au cœur des Pyrénées. Notre site arrive bientôt."
    />
    <meta property="og:url" content="https://chez-nours.com/" />
    <title>Chez Nours — Bientôt à Cauterets</title>
    <link rel="canonical" href="https://chez-nours.com/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="site-title">
        <img
          class="brand-artwork"
          src="assets/chez-nours-brand.jpeg"
          srcset="
            assets/chez-nours-brand-320.jpeg 320w,
            assets/chez-nours-brand-640.jpeg 640w,
            assets/chez-nours-brand.jpeg 896w
          "
          sizes="(max-width: 760px) 58vw, (max-width: 1100px) 36vw, 428px"
          alt="Chez Nours — Duplex cosy à Cauterets"
          width="896"
          height="1200"
          decoding="async"
          fetchpriority="high"
        />

        <h1 id="site-title" class="visually-hidden">Chez Nours</h1>

        <div class="announcement">
          <p class="eyebrow">Une parenthèse au cœur des Pyrénées</p>
          <h2>Notre site se prépare doucement.</h2>
          <p class="intro">
            Une adresse chaleureuse pour se retrouver, respirer l’air de la montagne
            et profiter de Cauterets en toute saison.
          </p>
          <p class="soon" aria-label="Site bientôt disponible">
            <span aria-hidden="true"></span>Bientôt en ligne
          </p>
        </div>
      </section>
    </main>
    <footer>Chez Nours · Cauterets, Hautes-Pyrénées</footer>
  </body>
</html>
